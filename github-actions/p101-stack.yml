name: p101 stack

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: OS job to run
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
          - macos
          - freebsd
  pull_request:
  push:
    branches: [ main ]

jobs:
  macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_os == 'all' || inputs.target_os == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: scripts
      - name: Install tools
        run: |
          brew untap aws/tap || true
          brew install cmake cppcheck llvm gcovr
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Clone p101 repos
        run: cd scripts && ./clone-repos.sh
      - name: Detect compilers
        run: cd scripts && ./check-compilers.sh
      - name: Update all repos
        run: |
          cd scripts
          export P101_QUIET=1
          printf 'clang\n' > ci_c_compilers.txt
          printf 'clang++\n' > ci_cxx_compilers.txt
          ./update-all.sh -C ci_c_compilers.txt -X ci_cxx_compilers.txt
      - name: Check after update-all
        run: cd scripts && P101_QUIET=1 ./check-after-update-all.sh -c clang -x clang++ -o ci-output
      - name: Publish instrumentation receipt
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-macos
          path: scripts/ci-output/instrumentation-receipt.json

  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_os == 'all' || inputs.target_os == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: scripts
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake clang clang-tidy clang-format libclang-dev cppcheck gcovr libgdbm-dev libgdbm-compat-dev
      - name: Clone p101 repos
        run: cd scripts && ./clone-repos.sh
      - name: Detect compilers
        run: cd scripts && ./check-compilers.sh
      - name: Update all repos
        run: |
          cd scripts
          export P101_QUIET=1
          printf 'clang\n' > ci_c_compilers.txt
          printf 'clang++\n' > ci_cxx_compilers.txt
          ./update-all.sh -C ci_c_compilers.txt -X ci_cxx_compilers.txt
      - name: Check after update-all
        run: cd scripts && P101_QUIET=1 ./check-after-update-all.sh -c clang -x clang++ -o ci-output
      - name: Publish instrumentation receipt
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-linux
          path: scripts/ci-output/instrumentation-receipt.json

  freebsd:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_os == 'all' || inputs.target_os == 'freebsd' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: scripts
      - name: Check in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          prepare: |
            pkg install -y bash git cmake llvm cppcheck python3 libxcrypt
            gcovr_pkg="$(pkg search -q -x '^py[0-9]+-gcovr$' | head -n 1 || true)"
            if [ -n "$gcovr_pkg" ]; then
              pkg install -y "$gcovr_pkg"
            else
              echo "No FreeBSD gcovr package found; coverage checks are not enabled in this workflow."
            fi
          run: |
            cd scripts
            export P101_QUIET=1
            ./clone-repos.sh
            ./check-compilers.sh
            printf 'clang\n' > ci_c_compilers.txt
            printf 'clang++\n' > ci_cxx_compilers.txt
            ./update-all.sh -C ci_c_compilers.txt -X ci_cxx_compilers.txt
            bash ./check-after-update-all.sh -c clang -x clang++ -o ci-output
      - name: Publish instrumentation receipt
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-freebsd
          path: scripts/ci-output/instrumentation-receipt.json

  instrumentation-matrix:
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.target_os == 'all') && needs.macos.result == 'success' && needs.linux.result == 'success' && needs.freebsd.result == 'success' }}
    needs: [macos, linux, freebsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: scripts
      - uses: actions/download-artifact@v5
        with:
          pattern: instrumentation-*
          path: instrumentation-receipts
      - name: Verify supported-platform instrumentation coverage
        run: >-
          python3 scripts/check-p101-instrumentation.py
          --merge-receipts instrumentation-receipts/*/instrumentation-receipt.json
          --require-platform Darwin
          --require-platform Linux
          --require-platform FreeBSD
