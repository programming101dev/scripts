name: p101 stack

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: OS job to run
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
          - macos
          - freebsd
      candidate_id:
        description: Immutable workspace candidate identity (publication only)
        required: false
        default: ''
        type: string
      candidate_lock_sha256:
        description: Candidate repos.lock SHA-256 (publication only)
        required: false
        default: ''
        type: string
      candidate_stack_contract_sha256:
        description: Candidate stack-contract SHA-256 (publication only)
        required: false
        default: ''
        type: string
      qualification_ref:
        description: Exact temporary candidate ref (publication only)
        required: false
        default: ''
        type: string
  pull_request:
  push:
    branches: [ main ]

jobs:
  request-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Validate candidate qualification inputs
        env:
          TARGET_OS: ${{ inputs.target_os }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          CANDIDATE_LOCK_SHA256: ${{ inputs.candidate_lock_sha256 }}
          CANDIDATE_STACK_CONTRACT_SHA256: ${{ inputs.candidate_stack_contract_sha256 }}
          QUALIFICATION_REF: ${{ inputs.qualification_ref }}
        run: |
          supplied=0
          [ -n "$CANDIDATE_ID" ] && supplied=$((supplied + 1))
          [ -n "$CANDIDATE_LOCK_SHA256" ] && supplied=$((supplied + 1))
          [ -n "$CANDIDATE_STACK_CONTRACT_SHA256" ] && supplied=$((supplied + 1))
          [ -n "$QUALIFICATION_REF" ] && supplied=$((supplied + 1))
          if [ "$supplied" -ne 0 ] && [ "$supplied" -ne 4 ]; then
            echo '::error::candidate qualification inputs must be supplied together'
            exit 2
          fi
          if [ "$supplied" -eq 4 ] && [ "$TARGET_OS" != all ]; then
            echo '::error::candidate qualification must run all supported platforms'
            exit 2
          fi
  macos:
    needs: request-contract
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_os == 'all' || inputs.target_os == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: scripts
      - name: Install tools
        run: |
          brew untap aws/tap || true
          brew install cmake cppcheck llvm gcovr shellcheck
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          # The runner image preinstalls an older clang-format at
          # /usr/local/bin, which tool detection can prefer over PATH order.
          # Point that path at Homebrew LLVM so every resolution agrees.
          sudo ln -sf "$(brew --prefix llvm)/bin/clang-format" /usr/local/bin/clang-format
      - name: Enforce clang-format major version
        run: |
          required="$(grep -Ev '^[[:space:]]*(#|$)' scripts/clang-format-version.txt | head -n 1 | tr -d '[:space:]')"
          required="${required#>=}"
          for candidate in /usr/local/bin/clang-format "$(brew --prefix llvm)/bin/clang-format"; do
            "$candidate" --version
            "$candidate" --version | grep -Eq "clang-format version ${required}\." \
              || { echo "::error::$candidate is not clang-format ${required}"; exit 1; }
          done
      - name: Run fast platform sentinel
        run: cd scripts && ./github-actions/platform-sentinel.sh
      - name: Restore exact workspace evidence and build lanes
        id: workspace-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            scripts/target/check-evidence-cache
            scripts/target/ci-build-cache
          key: p101-workspace-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            p101-workspace-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare macOS once, then build compiler pairs
        id: update
        run: |
          cd scripts
          export P101_QUIET=1
          export P101_REPOSITORY_BUILD_CACHE="$PWD/target/ci-build-cache"
          printf 'clang\n' > ci_c_compilers.txt
          printf 'clang++\n' > ci_cxx_compilers.txt
          mkdir -p ci-output
          if ./update-all.sh -C ci_c_compilers.txt -X ci_cxx_compilers.txt --format-check --matrix-output ci-output/compiler-matrix --acceptance-output ci-output > ci-output/update-all.log 2>&1; then
            status=0
          else
            status=$?
          fi
          cat ci-output/update-all.log
          exit "$status"
      - name: Save exact workspace evidence and build lanes
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            scripts/target/check-evidence-cache
            scripts/target/ci-build-cache
          key: ${{ steps.workspace-cache.outputs.cache-primary-key }}
      - name: Bind macOS acceptance to workspace candidate
        if: ${{ always() && inputs.candidate_id != '' && steps.update.outcome == 'success' }}
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          CANDIDATE_LOCK_SHA256: ${{ inputs.candidate_lock_sha256 }}
          CANDIDATE_STACK_CONTRACT_SHA256: ${{ inputs.candidate_stack_contract_sha256 }}
          QUALIFICATION_REF: ${{ inputs.qualification_ref }}
        run: |
          cd scripts
          test "$GITHUB_REF" = "$QUALIFICATION_REF"
          ./workspace/repos-lock.py platform-qualification \
            --candidate-id "$CANDIDATE_ID" \
            --candidate-lock-sha256 "$CANDIDATE_LOCK_SHA256" \
            --candidate-stack-contract-sha256 "$CANDIDATE_STACK_CONTRACT_SHA256" \
            --qualification-ref "$GITHUB_REF" \
            --scripts-commit "$(git rev-parse HEAD)" \
            --platform macos \
            --github-repository "$GITHUB_REPOSITORY" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --acceptance-receipt ci-output/receipt.json \
            --receipt ci-output/workspace-platform-qualification.json
      - name: Publish CI summary
        if: ${{ always() }}
        env:
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
          CHECK_OUTCOME: ${{ steps.update.outcome }}
        run: cd scripts && ./github-actions/publish-ci-summary.sh ci-output "$RUNNER_OS" "$UPDATE_OUTCOME" "$CHECK_OUTCOME"
      - name: Publish CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: instrumentation-macos
          path: scripts/ci-output
          if-no-files-found: warn

  linux:
    needs: request-contract
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_os == 'all' || inputs.target_os == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: scripts
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang clang-tidy libclang-dev cppcheck gcovr libgdbm-dev libgdbm-compat-dev shellcheck wget gnupg
          # Ubuntu's clang-format lags the pinned major; take it from apt.llvm.org.
          required="$(grep -Ev '^[[:space:]]*(#|$)' scripts/clang-format-version.txt | head -n 1 | tr -d '[:space:]')"
          required="${required#>=}"
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh "$required"
          sudo apt-get install -y "clang-format-${required}"
          sudo ln -sf "/usr/bin/clang-format-${required}" /usr/local/bin/clang-format
      - name: Enforce clang-format major version
        run: |
          required="$(grep -Ev '^[[:space:]]*(#|$)' scripts/clang-format-version.txt | head -n 1 | tr -d '[:space:]')"
          required="${required#>=}"
          clang-format --version
          clang-format --version | grep -Eq "clang-format version ${required}\." \
            || { echo "::error::clang-format is not version ${required}"; exit 1; }
      - name: Run fast platform sentinel
        run: cd scripts && ./github-actions/platform-sentinel.sh
      - name: Restore exact workspace evidence and build lanes
        id: workspace-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            scripts/target/check-evidence-cache
            scripts/target/ci-build-cache
          key: p101-workspace-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            p101-workspace-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare Linux once, then build compiler pairs
        id: update
        run: |
          cd scripts
          export P101_QUIET=1
          export P101_REPOSITORY_BUILD_CACHE="$PWD/target/ci-build-cache"
          printf 'clang\n' > ci_c_compilers.txt
          printf 'clang++\n' > ci_cxx_compilers.txt
          mkdir -p ci-output
          if ./update-all.sh -C ci_c_compilers.txt -X ci_cxx_compilers.txt --format-check --matrix-output ci-output/compiler-matrix --acceptance-output ci-output > ci-output/update-all.log 2>&1; then
            status=0
          else
            status=$?
          fi
          cat ci-output/update-all.log
          exit "$status"
      - name: Save exact workspace evidence and build lanes
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            scripts/target/check-evidence-cache
            scripts/target/ci-build-cache
          key: ${{ steps.workspace-cache.outputs.cache-primary-key }}
      - name: Bind Linux acceptance to workspace candidate
        if: ${{ always() && inputs.candidate_id != '' && steps.update.outcome == 'success' }}
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          CANDIDATE_LOCK_SHA256: ${{ inputs.candidate_lock_sha256 }}
          CANDIDATE_STACK_CONTRACT_SHA256: ${{ inputs.candidate_stack_contract_sha256 }}
          QUALIFICATION_REF: ${{ inputs.qualification_ref }}
        run: |
          cd scripts
          test "$GITHUB_REF" = "$QUALIFICATION_REF"
          ./workspace/repos-lock.py platform-qualification \
            --candidate-id "$CANDIDATE_ID" \
            --candidate-lock-sha256 "$CANDIDATE_LOCK_SHA256" \
            --candidate-stack-contract-sha256 "$CANDIDATE_STACK_CONTRACT_SHA256" \
            --qualification-ref "$GITHUB_REF" \
            --scripts-commit "$(git rev-parse HEAD)" \
            --platform linux \
            --github-repository "$GITHUB_REPOSITORY" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --acceptance-receipt ci-output/receipt.json \
            --receipt ci-output/workspace-platform-qualification.json
      - name: Publish CI summary
        if: ${{ always() }}
        env:
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
          CHECK_OUTCOME: ${{ steps.update.outcome }}
        run: cd scripts && ./github-actions/publish-ci-summary.sh ci-output "$RUNNER_OS" "$UPDATE_OUTCOME" "$CHECK_OUTCOME"
      - name: Publish CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: instrumentation-linux
          path: scripts/ci-output
          if-no-files-found: warn

  freebsd:
    needs: request-contract
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_os == 'all' || inputs.target_os == 'freebsd' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: scripts
      - name: Restore exact workspace evidence and build lanes
        id: workspace-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            scripts/target/check-evidence-cache
            scripts/target/ci-build-cache
          key: p101-workspace-v1-${{ runner.os }}-${{ runner.arch }}-freebsd-${{ github.sha }}
          restore-keys: |
            p101-workspace-v1-${{ runner.os }}-${{ runner.arch }}-freebsd-
      - name: Prepare FreeBSD once, then build compiler pairs
        id: freebsd-check
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          sync: rsync
          copyback: true
          prepare: |
            pkg install -y bash git cmake cppcheck python3 libxcrypt hs-ShellCheck
            required="$(grep -Ev '^[[:space:]]*(#|$)' scripts/clang-format-version.txt | head -n 1 | tr -d '[:space:]')"
            required="${required#>=}"
            if pkg install -y "llvm${required}"; then
              ln -sf "/usr/local/llvm${required}/bin/clang-format" /usr/local/bin/clang-format
              ln -sf "/usr/local/llvm${required}/bin/clang-tidy" /usr/local/bin/clang-tidy
            else
              echo "No llvm${required} package; falling back to the llvm metaport."
              pkg install -y llvm
            fi
            gcovr_pkg="$(pkg search -q -x '^py[0-9]+-gcovr$' | head -n 1 || true)"
            if [ -n "$gcovr_pkg" ]; then
              pkg install -y "$gcovr_pkg"
            else
              echo "No FreeBSD gcovr package found; coverage checks are not enabled in this workflow."
            fi
          run: |
            cd scripts
            git config --global --add safe.directory "$(pwd -P)"
            export P101_QUIET=1
            export P101_REPOSITORY_BUILD_CACHE="$PWD/target/ci-build-cache"
            status=0
            failed_phase=none
            mkdir -p ci-output
            required="$(grep -Ev '^[[:space:]]*(#|$)' clang-format-version.txt | head -n 1 | tr -d '[:space:]')"
            required="${required#>=}"
            clang-format --version | grep -Eq "clang-format version ${required}\." || {
              echo "clang-format is not version ${required}" > ci-output/clang-format-version.log
              cat ci-output/clang-format-version.log
              status=1
              failed_phase=tools
            }
            if [ "$status" -eq 0 ]; then
              ./github-actions/platform-sentinel.sh || {
                status=$?
                failed_phase=sentinel
              }
            fi
            if [ "$status" -eq 0 ]; then
              printf 'clang\n' > ci_c_compilers.txt
              printf 'clang++\n' > ci_cxx_compilers.txt
              ./update-all.sh -C ci_c_compilers.txt -X ci_cxx_compilers.txt --format-check --matrix-output ci-output/compiler-matrix --acceptance-output ci-output > ci-output/update-all.log 2>&1 || status=$?
              cat ci-output/update-all.log
              if [ "$status" -ne 0 ]; then
                if [ -f ci-output/summary.md ]; then
                  failed_phase=acceptance
                else
                  failed_phase=update
                fi
              fi
            fi
            printf '%s\n' "$failed_phase" > ci-output/freebsd-failed-phase
            printf '%s\n' "$status" > ci-output/freebsd-exit-code
            exit 0
      - name: Save exact workspace evidence and build lanes
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            scripts/target/check-evidence-cache
            scripts/target/ci-build-cache
          key: ${{ steps.workspace-cache.outputs.cache-primary-key }}
      - name: Publish CI summary
        if: ${{ always() }}
        env:
          VM_OUTCOME: ${{ steps.freebsd-check.outcome }}
        run: cd scripts && ./github-actions/publish-ci-summary.sh ci-output FreeBSD not-run "$VM_OUTCOME"
      - name: Bind FreeBSD acceptance to workspace candidate
        if: ${{ always() && inputs.candidate_id != '' }}
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          CANDIDATE_LOCK_SHA256: ${{ inputs.candidate_lock_sha256 }}
          CANDIDATE_STACK_CONTRACT_SHA256: ${{ inputs.candidate_stack_contract_sha256 }}
          QUALIFICATION_REF: ${{ inputs.qualification_ref }}
        run: |
          cd scripts
          if [ ! -f ci-output/freebsd-exit-code ] || [ "$(cat ci-output/freebsd-exit-code)" -ne 0 ]; then
            echo 'FreeBSD did not pass; no candidate qualification receipt written.'
            exit 0
          fi
          test "$GITHUB_REF" = "$QUALIFICATION_REF"
          ./workspace/repos-lock.py platform-qualification \
            --candidate-id "$CANDIDATE_ID" \
            --candidate-lock-sha256 "$CANDIDATE_LOCK_SHA256" \
            --candidate-stack-contract-sha256 "$CANDIDATE_STACK_CONTRACT_SHA256" \
            --qualification-ref "$GITHUB_REF" \
            --scripts-commit "$(git rev-parse HEAD)" \
            --platform freebsd \
            --github-repository "$GITHUB_REPOSITORY" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --acceptance-receipt ci-output/receipt.json \
            --receipt ci-output/workspace-platform-qualification.json
      - name: Enforce FreeBSD result
        run: scripts/github-actions/enforce-freebsd-result.sh scripts/ci-output
      - name: Publish CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: instrumentation-freebsd
          path: scripts/ci-output
          if-no-files-found: warn

  instrumentation-matrix:
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.target_os == 'all') && needs.macos.result == 'success' && needs.linux.result == 'success' && needs.freebsd.result == 'success' }}
    needs: [macos, linux, freebsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: scripts
      - uses: actions/download-artifact@v5
        with:
          pattern: instrumentation-*
          path: instrumentation-receipts
      - name: Verify supported-platform instrumentation coverage
        id: instrumentation
        run: >-
          python3 scripts/checks/check-p101-instrumentation.py
          --merge-receipts instrumentation-receipts/*/instrumentation-receipt.json
          --require-platform Darwin
          --require-platform Linux
          --require-platform FreeBSD
      - name: Verify supported-platform governed quality receipts
        id: quality
        run: >-
          python3 scripts/checks/check-p101-quality-contract.py
          --merge-platform-receipts instrumentation-receipts/*/receipt.json
          --require-platform macos
          --require-platform linux
          --require-platform freebsd
      - name: Aggregate immutable workspace candidate qualification
        if: ${{ inputs.candidate_id != '' }}
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          CANDIDATE_LOCK_SHA256: ${{ inputs.candidate_lock_sha256 }}
          CANDIDATE_STACK_CONTRACT_SHA256: ${{ inputs.candidate_stack_contract_sha256 }}
          QUALIFICATION_REF: ${{ inputs.qualification_ref }}
        run: |
          cd scripts
          test "$GITHUB_REF" = "$QUALIFICATION_REF"
          mapfile -t receipts < <(find ../instrumentation-receipts -name workspace-platform-qualification.json -type f -print | sort)
          if [ "${#receipts[@]}" -ne 3 ]; then
            echo "::error::expected 3 candidate-bound platform receipts; found ${#receipts[@]}"
            exit 1
          fi
          arguments=()
          for receipt in "${receipts[@]}"; do
            arguments+=(--platform-receipt "$receipt")
          done
          mkdir -p ../workspace-qualification
          ./workspace/repos-lock.py aggregate-qualification \
            --candidate-id "$CANDIDATE_ID" \
            --candidate-lock-sha256 "$CANDIDATE_LOCK_SHA256" \
            --candidate-stack-contract-sha256 "$CANDIDATE_STACK_CONTRACT_SHA256" \
            --qualification-ref "$GITHUB_REF" \
            --scripts-commit "$(git rev-parse HEAD)" \
            "${arguments[@]}" \
            --require-platform linux \
            --require-platform macos \
            --require-platform freebsd \
            --receipt ../workspace-qualification/workspace-qualification.json
      - name: Publish workspace qualification receipt
        if: ${{ inputs.candidate_id != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: workspace-qualification
          path: workspace-qualification/workspace-qualification.json
          if-no-files-found: error
      - name: Publish CI summary
        if: ${{ always() }}
        env:
          CHECK_OUTCOME: ${{ steps.instrumentation.outcome == 'success' && steps.quality.outcome || steps.instrumentation.outcome }}
        run: >-
          scripts/github-actions/publish-ci-summary.sh
          instrumentation-receipts
          supported-platform-matrix
          not-run
          "$CHECK_OUTCOME"
