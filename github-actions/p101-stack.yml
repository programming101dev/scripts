name: p101 stack

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: scripts
      - name: Install tools
        run: |
          brew untap aws/tap || true
          brew install cmake cppcheck llvm gcovr
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Clone p101 repos
        run: cd scripts && ./clone-repos.sh
      - name: Detect compilers
        run: cd scripts && ./check-compilers.sh
      - name: Update all repos
        run: |
          cd scripts
          printf 'clang\n' > ci_c_compilers.txt
          printf 'clang++\n' > ci_cxx_compilers.txt
          ./update-all.sh --skip-install -C ci_c_compilers.txt -X ci_cxx_compilers.txt
      - name: Check after update-all
        run: cd scripts && ./check-after-update-all.sh -c clang -x clang++

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: scripts
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake clang clang-tidy clang-format cppcheck gcovr libgdbm-dev libgdbm-compat-dev
      - name: Clone p101 repos
        run: cd scripts && ./clone-repos.sh
      - name: Detect compilers
        run: cd scripts && ./check-compilers.sh
      - name: Update all repos
        run: |
          cd scripts
          printf 'clang\n' > ci_c_compilers.txt
          printf 'clang++\n' > ci_cxx_compilers.txt
          ./update-all.sh --skip-install -C ci_c_compilers.txt -X ci_cxx_compilers.txt
      - name: Check after update-all
        run: cd scripts && ./check-after-update-all.sh -c clang -x clang++

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: scripts
      - name: Check in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          prepare: |
            pkg install -y bash git cmake llvm cppcheck py311-gcovr
          run: |
            cd scripts
            ./clone-repos.sh
            ./check-compilers.sh
            printf 'clang\n' > ci_c_compilers.txt
            printf 'clang++\n' > ci_cxx_compilers.txt
            ./update-all.sh --skip-install -C ci_c_compilers.txt -X ci_cxx_compilers.txt
            bash ./check-after-update-all.sh -c clang -x clang++
