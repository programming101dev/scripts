name: p101 stack

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: OS job to run
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
          - macos
          - freebsd
  pull_request:
  push:
    branches: [ main ]

jobs:
  macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_os == 'all' || inputs.target_os == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: scripts
      - name: Install tools
        run: |
          brew untap aws/tap || true
          brew install cmake cppcheck llvm gcovr shellcheck
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Clone p101 repos
        run: cd scripts && ./p101-workspace clone
      - name: Detect compilers
        run: cd scripts && ./p101-workspace compilers
      - name: Update all repos
        id: update
        run: |
          cd scripts
          export P101_QUIET=1
          printf 'clang\n' > ci_c_compilers.txt
          printf 'clang++\n' > ci_cxx_compilers.txt
          mkdir -p ci-output
          if ./update-all.sh -C ci_c_compilers.txt -X ci_cxx_compilers.txt > ci-output/update-all.log 2>&1; then
            status=0
          else
            status=$?
          fi
          cat ci-output/update-all.log
          exit "$status"
      - name: Check after update-all
        id: check
        run: cd scripts && P101_QUIET=1 ./check-after-update-all.sh -c clang -x clang++ -o ci-output
      - name: Publish CI summary
        if: ${{ always() }}
        env:
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: cd scripts && ./github-actions/publish-ci-summary.sh ci-output "$RUNNER_OS" "$UPDATE_OUTCOME" "$CHECK_OUTCOME"
      - name: Publish CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: instrumentation-macos
          path: scripts/ci-output
          if-no-files-found: warn

  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_os == 'all' || inputs.target_os == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: scripts
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake clang clang-tidy clang-format libclang-dev cppcheck gcovr libgdbm-dev libgdbm-compat-dev shellcheck
      - name: Clone p101 repos
        run: cd scripts && ./p101-workspace clone
      - name: Detect compilers
        run: cd scripts && ./p101-workspace compilers
      - name: Update all repos
        id: update
        run: |
          cd scripts
          export P101_QUIET=1
          printf 'clang\n' > ci_c_compilers.txt
          printf 'clang++\n' > ci_cxx_compilers.txt
          mkdir -p ci-output
          if ./update-all.sh -C ci_c_compilers.txt -X ci_cxx_compilers.txt > ci-output/update-all.log 2>&1; then
            status=0
          else
            status=$?
          fi
          cat ci-output/update-all.log
          exit "$status"
      - name: Check after update-all
        id: check
        run: cd scripts && P101_QUIET=1 ./check-after-update-all.sh -c clang -x clang++ -o ci-output
      - name: Publish CI summary
        if: ${{ always() }}
        env:
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: cd scripts && ./github-actions/publish-ci-summary.sh ci-output "$RUNNER_OS" "$UPDATE_OUTCOME" "$CHECK_OUTCOME"
      - name: Publish CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: instrumentation-linux
          path: scripts/ci-output
          if-no-files-found: warn

  freebsd:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_os == 'all' || inputs.target_os == 'freebsd' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: scripts
      - name: Check in FreeBSD VM
        id: freebsd-check
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          sync: rsync
          copyback: true
          prepare: |
            pkg install -y bash git cmake llvm cppcheck python3 libxcrypt hs-ShellCheck
            gcovr_pkg="$(pkg search -q -x '^py[0-9]+-gcovr$' | head -n 1 || true)"
            if [ -n "$gcovr_pkg" ]; then
              pkg install -y "$gcovr_pkg"
            else
              echo "No FreeBSD gcovr package found; coverage checks are not enabled in this workflow."
            fi
          run: |
            cd scripts
            export P101_QUIET=1
            status=0
            mkdir -p ci-output
            ./p101-workspace clone || status=$?
            if [ "$status" -eq 0 ]; then
              ./p101-workspace compilers || status=$?
            fi
            if [ "$status" -eq 0 ]; then
              printf 'clang\n' > ci_c_compilers.txt
              printf 'clang++\n' > ci_cxx_compilers.txt
              ./update-all.sh -C ci_c_compilers.txt -X ci_cxx_compilers.txt > ci-output/update-all.log 2>&1 || status=$?
              cat ci-output/update-all.log
            fi
            if [ "$status" -eq 0 ]; then
              bash ./check-after-update-all.sh -c clang -x clang++ -o ci-output || status=$?
            fi
            printf '%s\n' "$status" > ci-output/freebsd-exit-code
            exit 0
      - name: Publish CI summary
        if: ${{ always() }}
        env:
          VM_OUTCOME: ${{ steps.freebsd-check.outcome }}
        run: cd scripts && ./github-actions/publish-ci-summary.sh ci-output FreeBSD not-run "$VM_OUTCOME"
      - name: Enforce FreeBSD result
        run: |
          if [ ! -f scripts/ci-output/freebsd-exit-code ]; then
            echo "FreeBSD VM did not return an exit-status receipt." >&2
            exit 2
          fi
          status="$(cat scripts/ci-output/freebsd-exit-code)"
          if [ "$status" -ne 0 ]; then
            echo "FreeBSD checks failed with exit $status; see the preceding log tail and uploaded evidence." >&2
          fi
          exit "$status"
      - name: Publish CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: instrumentation-freebsd
          path: scripts/ci-output
          if-no-files-found: warn

  instrumentation-matrix:
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.target_os == 'all') && needs.macos.result == 'success' && needs.linux.result == 'success' && needs.freebsd.result == 'success' }}
    needs: [macos, linux, freebsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: scripts
      - uses: actions/download-artifact@v5
        with:
          pattern: instrumentation-*
          path: instrumentation-receipts
      - name: Verify supported-platform instrumentation coverage
        id: instrumentation
        run: >-
          python3 scripts/checks/check-p101-instrumentation.py
          --merge-receipts instrumentation-receipts/*/instrumentation-receipt.json
          --require-platform Darwin
          --require-platform Linux
          --require-platform FreeBSD
      - name: Verify supported-platform governed quality receipts
        id: quality
        run: >-
          python3 scripts/checks/check-p101-quality-contract.py
          --merge-platform-receipts instrumentation-receipts/*/receipt.json
          --require-platform macos
          --require-platform linux
          --require-platform freebsd
      - name: Publish CI summary
        if: ${{ always() }}
        env:
          CHECK_OUTCOME: ${{ steps.instrumentation.outcome == 'success' && steps.quality.outcome || steps.instrumentation.outcome }}
        run: >-
          scripts/github-actions/publish-ci-summary.sh
          instrumentation-receipts
          supported-platform-matrix
          not-run
          "$CHECK_OUTCOME"
